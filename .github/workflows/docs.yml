name: 文档门禁

on:
  pull_request:
    branches: [m1, m2]
  push:
    branches: [m1, m1-docs, m1-design, m2, m2-ci-fix]

permissions:
  contents: read

jobs:
  docs:
    name: 文档与引用检查
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: 读取当前提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 检查 UTF-8、引用、PRD 状态与凭据模式
        env:
          PYTHONUTF8: '1'
        run: python scripts/check-docs.py
